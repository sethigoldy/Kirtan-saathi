name: CI

# Every push to any branch and every pull request: build, unit tests, and a
# native model smoke test on each desktop platform.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unit tests do not need the Electron binary or ONNX Runtime GPU add-ons.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      npm_config_onnxruntime_node_install: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and unit tests
        run: npm test

      - name: Cache acoustic model
        uses: actions/cache@v4
        with:
          path: models
          key: model-karansea-int8-v1

      - name: Fetch acoustic model
        run: npm run fetch-assets -- --model-only

      - name: Model smoke test (ONNX Runtime native binary on this platform)
        run: node dist/cli/model-smoke.js

  captions:
    name: Caption labeller (synthetic broadcast)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      npm_config_onnxruntime_node_install: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tools (ffmpeg, Tesseract with the Gurmukhi model, Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
          mkdir -p "$RUNNER_TEMP/tessdata"
          curl -sSfL -o "$RUNNER_TEMP/tessdata/pan.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/pan.traineddata
          pip install --quiet pillow fonttools brotli

      - name: Install and build
        run: |
          npm ci
          npm run build

      # A 50 s broadcast-style video from the Japji fixture: Gurbani caption and
      # Punjabi arth on a translucent band over a moving background, with
      # random operator lag. The labeller must recover the captions.
      - name: Label a synthetic captioned broadcast
        env:
          TESSDATA_PREFIX: ${{ runner.temp }}/tessdata
        run: |
          python3 scripts/make-caption-video.py test/fixtures/japji-50s.timeline.json test/fixtures/japji-50s.wav "$RUNNER_TEMP/cap/japji.mp4" --style translucent --font anek --seconds 50
          node dist/cli/caption-label.js "$RUNNER_TEMP/cap/japji.mp4" --out "$RUNNER_TEMP/cap/out"
          node dist/cli/caption-eval.js "$RUNNER_TEMP/cap/out/japji/japji.json" "$RUNNER_TEMP/cap/japji.truth.json" --min-recall 0.9

  # Every operator feature, checked in the packaged Windows app (what the
  # installer installs): listening through a fake microphone that plays the
  # Japji fixture, steering, Find, looks, projector, phones, OBS, restart.
  app:
    name: Windows app (end-to-end)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      npm_config_onnxruntime_node_install: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Cache acoustic model
        uses: actions/cache@v4
        with:
          path: models
          key: model-karansea-int8-v1

      - name: Fetch acoustic model
        run: npm run fetch-assets -- --model-only

      - name: Package the Windows app (no installer)
        run: npx electron-builder --win --x64 --dir --publish never

      - name: End-to-end tests
        shell: pwsh
        env:
          E2E_OUT: e2e-results
        run: |
          $env:KIRTAN_APP = (Resolve-Path 'release\win-unpacked\Kirtan Saathi.exe').Path
          npm run e2e

      - name: Upload screenshots and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows
          path: e2e-results/
          if-no-files-found: ignore
