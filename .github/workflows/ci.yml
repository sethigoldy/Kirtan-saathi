name: CI

# Every push to any branch and every pull request: build, unit tests, and a
# native model smoke test on each desktop platform.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unit tests do not need the Electron binary or ONNX Runtime GPU add-ons.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      npm_config_onnxruntime_node_install: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and unit tests
        run: npm test

      - name: Cache acoustic model
        uses: actions/cache@v4
        with:
          path: models
          key: model-karansea-int8-v1

      - name: Fetch acoustic model
        run: npm run fetch-assets -- --model-only

      - name: Model smoke test (ONNX Runtime native binary on this platform)
        run: node dist/cli/model-smoke.js
