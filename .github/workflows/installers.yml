name: Installers

# Builds the installers people download: a Windows setup wizard, macOS disk
# images for Apple Silicon and Intel, and Linux packages. Each installer is
# installed on a clean CI machine of its own OS and the installed app is run
# against a recorded Japji Sahib paath before anything is published. The
# installed Windows app also passes the end-to-end tests (src/e2e/).
#
# The Windows job also builds the Microsoft Store package (.appx, identity in
# electron-builder.yml), installs a test-signed copy and runs the same checks
# against it. Except on pull requests, the package is kept as the
# "microsoft-store-package" artifact. It is not a release asset: Windows
# installs only signed packages, and the Store signs it. After a release, the
# "store" job submits it to Partner Center when the Partner Center API secrets
# are set (README → Microsoft Store); otherwise it is uploaded by hand.
#
#   Merge to main with a new "version" in package.json -> GitHub Release vX.Y.Z
#                                     (the tag is created by this workflow; versions
#                                     already released are skipped without building)
#   Push a tag v1.2.3 (matching package.json) -> the same release, by tag
#   Run manually ("Run workflow")              -> installers as workflow artifacts;
#                                                 tick "prerelease" to also publish a test release
#   Pull requests touching packaging           -> build and install-test only
#
# Optional signing secrets (without them the apps are unsigned, and the
# release notes explain the one-time "Run anyway" / "Open Anyway" steps):
#   macOS:   MAC_CSC_LINK (base64 .p12 Developer ID Application), MAC_CSC_KEY_PASSWORD,
#            APPLE_API_KEY (contents of the .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - electron-builder.yml
      - build/**
      - scripts/after-pack.cjs
      - scripts/check-smoke.mjs
      - scripts/check-windows-dlls.mjs
      - scripts/fetch-assets.mjs
      - scripts/watch-windows-smoke.ps1
      - scripts/windows-dlls.cjs
      - package.json
      - package-lock.json
      - src/main/**
      - .github/workflows/installers.yml
  workflow_dispatch:
    inputs:
      prerelease:
        description: Also publish these installers as a test release (pre-release)
        type: boolean
        default: false

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Decide what to build and publish
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          build=true publish=false prerelease=false tag="v$version"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              if [ "$GITHUB_REF_NAME" != "v$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Update package.json or re-tag."
                exit 1
              fi
              publish=true ;;
            push:branch)
              if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "v$version is already released: nothing to build"
                build=false
              else
                echo "v$version has no release yet: building and publishing it"
                publish=true
              fi ;;
            workflow_dispatch:*)
              if [ "$PRERELEASE_INPUT" = true ]; then
                publish=true prerelease=true tag="v$version-test.$GITHUB_RUN_NUMBER"
              fi ;;
          esac
          if [ "$publish" = true ] && [ "$prerelease" != true ] && ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add what changed: it becomes the release notes and the app's update notice."
            exit 1
          fi
          echo "build=$build publish=$publish prerelease=$prerelease tag=$tag"
          { echo "build=$build"; echo "publish=$publish"; echo "prerelease=$prerelease"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, target: --win --x64, mac: '' }
          - { label: Mac (Apple Silicon), os: macos-15, target: --mac --arm64, mac: Apple-Silicon }
          - { label: Mac (Intel), os: macos-15-intel, target: --mac --x64, mac: Intel }
          - { label: Linux, os: ubuntu-24.04, target: --linux --x64, mac: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      npm_config_onnxruntime_node_install: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Cache acoustic model
        uses: actions/cache@v4
        with:
          path: models
          key: model-karansea-int8-5fd2e89e

      - name: Fetch acoustic model (pinned revision, checksum verified)
        run: npm run fetch-assets -- --model-only

      - name: Package
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_FLAVOUR: ${{ matrix.mac }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            # People choose by chip name, not by CPU architecture.
            extra+=("-c.dmg.artifactName=Kirtan-Saathi-\${version}-Mac-$MAC_FLAVOUR.\${ext}")
            if [ -n "$MAC_CSC_LINK" ]; then
              echo "Signing with the Developer ID certificate"
              export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              if [ -n "$APPLE_API_KEY_CONTENT" ]; then
                printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
                export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
                extra+=(-c.mac.notarize=true)
              fi
            else
              # Ad-hoc signature: macOS then offers "Open Anyway" instead of
              # reporting the app as damaged.
              echo "No Apple certificate: ad-hoc signing"
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              # electron-builder skips signing on pull-request builds by default;
              # an unsigned arm64 app is reported as damaged, so sign PR builds too.
              export CSC_FOR_PULL_REQUEST=true
              # (Hardened runtime stays on: the entitlements include
              # disable-library-validation, which ad-hoc signing needs.)
              extra+=(-c.mac.identity=-)
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with the Windows certificate"
            export WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npx electron-builder ${{ matrix.target }} --publish never "${extra[@]}"
          ls -la release

      - name: Native modules need only Windows
        if: runner.os == 'Windows'
        run: node scripts/check-windows-dlls.mjs release/win-unpacked

      # ---- Install the installer and run the installed app ----

      - name: Install and run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Kirtan-Saathi-Setup-*.exe' | Select-Object -First 1
          Write-Host "Installing $($setup.Name) silently"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Kirtan Saathi.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Kirtan Saathi.exe not found after installation' }
          Write-Host "Installed at $($exe.FullName)"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Kirtan Saathi.lnk") -and -not (Test-Path "$env:PUBLIC\Desktop\Kirtan Saathi.lnk")) {
            Write-Warning 'Desktop shortcut not found'
          }
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:GURBANI_SMOKE = "$PWD\test\fixtures\japji-50s.wav"
          $env:GURBANI_SMOKE_MODE = 'paath'
          $env:GURBANI_SMOKE_SECONDS = '45'
          $env:GURBANI_SMOKE_SHOT = "$PWD\smoke\operator.png"
          $env:GURBANI_SMOKE_PROJECTOR = "$PWD\smoke\projector.png"
          $env:GURBANI_SMOKE_REPORT = "$PWD\smoke\report.json"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--disable-gpu' -PassThru -RedirectStandardOutput smoke\app.log -RedirectStandardError smoke\app.err
          ./scripts/watch-windows-smoke.ps1 -Process $p -AppDir $exe.DirectoryName
          Get-Content smoke\app.log -ErrorAction SilentlyContinue | Select-Object -Last 20
          node scripts/check-smoke.mjs smoke/report.json smoke/operator.png smoke/projector.png

      - name: End-to-end tests (installed Windows app)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          E2E_OUT: smoke/e2e
          # The installed app must be able to update itself (checked, not skipped).
          E2E_EXPECT_SELF_UPDATE: '1'
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Kirtan Saathi.exe' | Select-Object -First 1
          $env:KIRTAN_APP = $exe.FullName
          npm run e2e

      - name: Microsoft Store package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder --win appx --x64 --prepackaged release/win-unpacked --publish never
          ls -la release/*.appx
          # The package identity, for installing the test copy below.
          echo "STORE_NAME=$(sed -n 's/^  identityName: //p' electron-builder.yml)" >> "$GITHUB_ENV"
          echo "STORE_PUBLISHER=$(sed -n 's/^  publisher: //p' electron-builder.yml)" >> "$GITHUB_ENV"

      - name: Install and run (Microsoft Store package)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The uploaded package stays unsigned (the Store signs it); this machine
          # gets a copy signed with a throwaway certificate for the same publisher.
          $appx = Get-ChildItem release -Filter '*-Microsoft-Store.appx' | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:STORE_PUBLISHER -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = "$env:RUNNER_TEMP\store-test.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString test -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\store-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\store-test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
          $test = "$env:RUNNER_TEMP\store-test.appx"
          Copy-Item $appx.FullName $test
          & $signtool.FullName sign /fd SHA256 /f $pfx /p test $test
          if ($LASTEXITCODE) { throw 'signing the test copy failed' }
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name $env:STORE_NAME
          if (-not $pkg) { throw 'the Store package did not install' }
          Write-Host "Installed $($pkg.PackageFullName) at $($pkg.InstallLocation)"
          $exe = Join-Path $pkg.InstallLocation 'app\Kirtan Saathi.exe'
          "STORE_EXE=$exe" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force smoke\store | Out-Null
          $env:GURBANI_SMOKE = "$PWD\test\fixtures\japji-50s.wav"
          $env:GURBANI_SMOKE_MODE = 'paath'
          $env:GURBANI_SMOKE_SECONDS = '45'
          $env:GURBANI_SMOKE_SHOT = "$PWD\smoke\store\operator.png"
          $env:GURBANI_SMOKE_PROJECTOR = "$PWD\smoke\store\projector.png"
          $env:GURBANI_SMOKE_REPORT = "$PWD\smoke\store\report.json"
          $p = Start-Process -FilePath $exe -ArgumentList '--disable-gpu' -PassThru -RedirectStandardOutput smoke\store\app.log -RedirectStandardError smoke\store\app.err
          ./scripts/watch-windows-smoke.ps1 -Process $p -AppDir $pkg.InstallLocation
          Get-Content smoke\store\app.log -ErrorAction SilentlyContinue | Select-Object -Last 20
          node scripts/check-smoke.mjs smoke/store/report.json smoke/store/operator.png smoke/store/projector.png

      - name: End-to-end tests (Microsoft Store package)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          E2E_OUT: smoke/e2e-store
          # The package must run as a Store app: updates come from the Store.
          E2E_EXPECT_STORE: '1'
        run: |
          $env:KIRTAN_APP = $env:STORE_EXE
          npm run e2e

      - name: Keep the Microsoft Store package
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-package
          path: release/*-Microsoft-Store.appx
          if-no-files-found: error
          compression-level: 0

      - name: Install and run (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls release/Kirtan-Saathi-*.dmg | head -1)
          echo "Mounting $dmg"
          hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/KirtanSaathi
          cp -R "/Volumes/KirtanSaathi/Kirtan Saathi.app" /Applications/
          hdiutil detach /Volumes/KirtanSaathi
          app="/Applications/Kirtan Saathi.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier' || true
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/Kirtan Saathi"
          mkdir -p smoke
          GURBANI_SMOKE="$PWD/test/fixtures/japji-50s.wav" GURBANI_SMOKE_MODE=paath GURBANI_SMOKE_SECONDS=45 \
          GURBANI_SMOKE_SHOT="$PWD/smoke/operator.png" GURBANI_SMOKE_PROJECTOR="$PWD/smoke/projector.png" \
          GURBANI_SMOKE_REPORT="$PWD/smoke/report.json" \
            perl -e 'alarm shift; exec @ARGV' 180 "$app/Contents/MacOS/Kirtan Saathi" --disable-gpu > smoke/app.log 2>&1 || true
          tail -20 smoke/app.log
          node scripts/check-smoke.mjs smoke/report.json smoke/operator.png smoke/projector.png

      - name: Install and run (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get install -y ./release/kirtan-saathi_*.deb
          bin=$(dpkg -L kirtan-saathi | grep -E '/kirtan-saathi$' | grep '^/opt/' | head -1)
          echo "Installed at $bin"
          mkdir -p smoke
          GURBANI_SMOKE="$PWD/test/fixtures/japji-50s.wav" GURBANI_SMOKE_MODE=paath GURBANI_SMOKE_SECONDS=45 \
          GURBANI_SMOKE_SHOT="$PWD/smoke/operator.png" GURBANI_SMOKE_PROJECTOR="$PWD/smoke/projector.png" \
          GURBANI_SMOKE_REPORT="$PWD/smoke/report.json" \
            timeout 180 xvfb-run -a -s "-screen 0 1400x900x24" "$bin" --no-sandbox --disable-gpu > smoke/app.log 2>&1 || true
          tail -20 smoke/app.log
          node scripts/check-smoke.mjs smoke/report.json smoke/operator.png smoke/projector.png

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke/
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # latest*.yml and the blockmaps let installed apps update themselves.
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb
            release/*.AppImage
            release/latest.yml
            release/latest-linux.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist-installers
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cd dist-installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          tag="$TAG"
          # --target creates the tag on this commit when it does not exist yet
          # (merge to main); an existing tag (tag push) is used as is.
          if [ "$PRERELEASE" = true ]; then
            title="Kirtan Saathi $version (test build $GITHUB_RUN_NUMBER)"; flags=(--prerelease --target "$GITHUB_SHA")
          else
            title="Kirtan Saathi $version"; flags=(--target "$GITHUB_SHA")
          fi
          # What's new (from CHANGELOG.md; the app shows the same list), then the install guide.
          {
            if grep -qx "## $version" CHANGELOG.md; then
              echo "## What's new in $version"
              echo
              awk -v h="## $version" '$0 == h {p = 1; next} /^## / {p = 0} p' CHANGELOG.md
              echo
            fi
            sed -e "s/{{VERSION}}/$version/g" -e "s/{{TAG}}/$tag/g" .github/release-notes.md
          } > notes.md
          gh release create "$tag" dist-installers/* --title "$title" --notes-file notes.md "${flags[@]}"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  # Submits the release's Store package to Partner Center (Store ID
  # 9PPGF42F3MDN); the Store publishes it after certification. Needs the
  # secrets AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
  # AZURE_AD_APPLICATION_SECRET and SELLER_ID, and an app that is already live.
  store:
    name: Submit to the Microsoft Store
    needs: [plan, build, release]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.prerelease != 'true'
    runs-on: windows-latest
    env:
      CAN_SUBMIT: ${{ secrets.AZURE_AD_APPLICATION_SECRET != '' }}
    steps:
      - name: Without Partner Center credentials
        if: env.CAN_SUBMIT != 'true'
        run: echo "::notice::No Partner Center API secrets. Upload the microsoft-store-package artifact in Partner Center (README → Microsoft Store)."

      - uses: actions/download-artifact@v4
        if: env.CAN_SUBMIT == 'true'
        with:
          name: microsoft-store-package
          path: store

      - uses: microsoft/microsoft-store-apppublisher@v1.4
        if: env.CAN_SUBMIT == 'true'

      - name: Submit the package
        if: env.CAN_SUBMIT == 'true'
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          $appx = Get-ChildItem store -Filter '*-Microsoft-Store.appx' | Select-Object -First 1
          if (-not $appx) { throw 'no Store package in the artifact' }
          # The CLI takes .msix files; .appx is the same package format.
          $msix = Join-Path $env:RUNNER_TEMP ($appx.BaseName + '.msix')
          Copy-Item $appx.FullName $msix
          # Creates a submission from the live one with this package and commits it to certification.
          msstore publish $msix -id 9PPGF42F3MDN
          if ($LASTEXITCODE) { throw "msstore publish failed ($LASTEXITCODE)" }
          "Submitted $($appx.Name) to the Microsoft Store; it goes live after certification." >> $env:GITHUB_STEP_SUMMARY
